name: Build

# Builds, tests, lints and packages the APK. Needed because the app cannot be compiled on a phone.
# Copy this file to .github/workflows/build.yml in the GitHub web UI (Add file → Create new file) once;
# after that every push builds an installable Wajabati-<version>.apk artifact, and a v* tag publishes a release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  apk:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name and checksum
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "Wajabati-$version.apk"
          sha256sum "Wajabati-$version.apk" | tee "Wajabati-$version.apk.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Wajabati-*
          if-no-files-found: error
          retention-days: 90

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Wajabati ${GITHUB_REF_NAME#v}" --generate-notes
