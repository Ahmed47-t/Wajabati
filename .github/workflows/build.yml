name: Build

# The APK is built here because a phone-only workflow cannot run Gradle: Actions → Build → Run workflow.
# The project signs with the Android Debug certificate (app/build.gradle), so the artifact installs as an update
# over 0.13.1 as long as this repository's own CI signed the previous release the same way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  apk:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name and checksum
        id: pack
        run: |
          set -euo pipefail
          version=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          cp "$apk" "Wajabati-$version.apk"
          sha256sum "Wajabati-$version.apk" | tee "Wajabati-$version.apk.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Wajabati-${{ steps.pack.outputs.version }}-apk
          path: |
            Wajabati-*.apk
            Wajabati-*.apk.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Wajabati-${{ needs.apk.outputs.version }}-apk
          path: dist
        continue-on-error: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist || true
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/*.sha256 \
            --title "Wajabati ${GITHUB_REF_NAME#v}" --notes-file .github/RELEASE_NOTES_TEMPLATE.md || \
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
